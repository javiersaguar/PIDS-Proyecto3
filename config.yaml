# Parámetros del proyecto. Los scripts los leen con comun.config.cargar_config();
# ningún valor de esta lista se repite escrito en el código.

rutas:
  csv_bruto: datos/brutos/rome_u_journeys.csv
  viajes_limpios: datos/procesados/viajes_limpios.parquet
  externos: datos/externos
  tablas: resultados/tablas
  figuras: resultados/figuras
  web_datos: frontend/public/datos

datos:
  sha256_csv: a2a3e147e05a6a4fc4462b991245245b3c954ac6ada3e265f0261b24cc7cf3f5
  zona_horaria: Europe/Rome
  formato_fecha: "%d/%m/%Y %H:%M:%S"
  # Periodo de cada viaje según el día de salida, extremos incluidos.
  periodos:
    ajuste: ["2021-02-01", "2021-02-21"]
    reservada: ["2021-02-22", "2021-02-28"]

# Umbrales iniciales de la limpieza (T10). Se revisan con los histogramas de
# resultados/figuras/exploracion/T10_umbrales.
limpieza:
  tt_min_s: 60
  dis_min_m: 100
  vel_min_kmh: 2
  vel_max_kmh: 25
  tt_max_s: 7200
  tolerancia_tt_s: 1
  tolerancia_vel_kmh: 0.01
  tolerancia_precio_eur: 0.01
  tarifa:
    desbloqueo_eur: 1.0
    minuto_eur: 0.15
  # Rectángulo amplio alrededor de Roma; los puntos aislados dentro de él se
  # estudian en T13.
  zona_servicio:
    lon: [12.2, 12.8]
    lat: [41.7, 42.1]

# Variante menos restrictiva para comprobar que las conclusiones no dependen de
# los umbrales (T10). Solo se indican los valores que cambian respecto a `limpieza`.
limpieza_permisiva:
  tt_min_s: 30
  dis_min_m: 50
  vel_min_kmh: 0
  vel_max_kmh: 30
  tt_max_s: 10800

exploracion:
  # Franjas provisionales hasta que T12 las fije. Intervalos [inicio, fin) en horas.
  franjas_horarias:
    madrugada: [0, 7]
    punta_manana: [7, 10]
    mediodia: [10, 16]
    punta_tarde: [16, 20]
    noche: [20, 24]
  resoluciones_h3: [8, 9]
  # Salto mínimo entre el final de un viaje y el inicio del siguiente del mismo
  # patinete para considerarlo recolocación (T11), y valores de la sensibilidad.
  umbral_recolocacion_m: 200
  umbrales_recolocacion_m: [100, 200, 300, 500, 1000, 2000]

# Lime Gen 3.0, especificaciones del enunciado.
patinete:
  masa_kg: 22.5
  potencia_w: 250
  velocidad_max_kmh: 25
  consumo_wh_km: 13.5
  bateria_wh: 576
  bateria_v: 36
  bateria_ah: 16
  tiempo_recarga_h: 7

# Decisiones de la fase 0 para la movilidad (docs/conclusiones_eda.md).
movilidad:
  # Rejilla H3 de los mapas, saldos y matrices OD (T13, T14, T20) y de los
  # candidatos a estación (T13: 201 m de arista).
  resolucion_mapas: 8
  resolucion_candidatos: 9
  # Radios de acceso a pie del barrido (T15); 400 m solo como sensibilidad.
  radios_acceso_m: [200, 250, 300, 400]
  # Velocidad a pie (hipótesis). Bohannon y Andrews (2011), «Normal walking speed:
  # a descriptive meta-analysis», Physiotherapy 97(3), 182-189, recogen de 1,24 a
  # 1,43 m/s en adultos de 20 a 69 años; se toma 1,3 m/s, dentro de ese rango.
  velocidad_pie_ms: 1.3
  # Distancia de ruta / distancia en línea recta: mediana medida en T15. Si cambia
  # la limpieza, se vuelve a copiar aquí desde T15_indicadores.
  factor_rodeo: 1.328
  # Rebalanceo nocturno del escenario base (T14: cota inferior de unos 100
  # patinetes/día en resolución 8); 0 y 220 (cota en resolución 9) como sensibilidad.
  rebalanceo_base_patinetes_dia: 100
  rebalanceo_sensibilidad_patinetes_dia: [0, 100, 220]

semilla: 2021

# Entrega (enunciado): GZZ-P3.zip con GZZ-P3.pdf y GZZ-P3_code/, con ZZ el número de
# grupo en dos cifras. Somos el grupo 2; la memoria lo lee de aquí.
entrega:
  grupo: "02"
