name: Web de resultados

# Compila frontend/ y la presentación (presentacion/diapositivas, servida en /presentacion/) y los
# publica en GitHub Pages cada vez que main cambia la web, la presentación o sus datos.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "presentacion/diapositivas/**"
      - "resultados/tablas/**"
      - "docs/TAREAS.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  compilar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            presentacion/diapositivas/package-lock.json
      - run: npm ci
      - run: npm run build
      # La presentación animada se publica dentro de la web, en /presentacion/.
      - name: Presentación
        working-directory: presentacion/diapositivas
        run: |
          npm ci
          npm run build
          cp -r dist ../../frontend/dist/presentacion
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  desplegar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
